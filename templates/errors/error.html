{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}

{% block content %}
<div class="card card-body max-w-lg space-y-2">
  <p class="text-3xl font-semibold text-slate-900">{{ code }}</p>
  <p class="text-sm text-slate-600">{{ message }}</p>
  <a href="{{ url('accounts:dashboard') }}" class="btn-primary w-fit">Back to dashboard</a>
</div>
{% endblock %}

{% block anon_content %}
<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="card card-body max-w-sm space-y-2 text-center">
    <p class="text-3xl font-semibold text-slate-900">{{ code }}</p>
    <p class="text-sm text-slate-600">{{ message }}</p>
    <a href="{{ url('accounts:login') }}" class="btn-primary">Sign in</a>
  </div>
</div>
{% endblock %}
