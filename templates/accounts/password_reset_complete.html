{% extends "base.html" %}
{% block title %}Password changed{% endblock %}

{% block anon_content %}
<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="card card-body w-full max-w-sm space-y-3 text-center">
    <h1 class="text-lg font-semibold text-slate-900">Password changed</h1>
    <p class="text-sm text-slate-500">You can now sign in with your new password.</p>
    <a href="{{ url('accounts:login') }}" class="btn-primary">Sign in</a>
  </div>
</div>
{% endblock %}
