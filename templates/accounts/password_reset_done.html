{% extends "base.html" %}
{% block title %}Check your email{% endblock %}

{% block anon_content %}
<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="card card-body w-full max-w-sm space-y-3 text-center">
    <h1 class="text-lg font-semibold text-slate-900">Check your email</h1>
    <p class="text-sm text-slate-500">
      If an account exists for that address, a password reset link is on its way.
      The link expires after a short time.
    </p>
    <a href="{{ url('accounts:login') }}" class="btn-secondary">Back to sign in</a>
  </div>
</div>
{% endblock %}
