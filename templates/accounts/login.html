{% extends "base.html" %}
{% from "components/macros.html" import form_fields %}
{% block title %}Sign in - Absence Management{% endblock %}

{% block anon_content %}
<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-indigo-600 text-xl font-bold text-white">A</span>
      <h1 class="mt-3 text-xl font-semibold text-slate-900">Absence Management System</h1>
      <p class="text-sm text-slate-500">Sign in to continue</p>
    </div>

    <form method="post" class="card card-body space-y-4">
      {{ csrf_input }}
      {{ form_fields(form) }}
      <button type="submit" class="btn-primary w-full">Sign in</button>
      <p class="text-center text-sm">
        <a href="{{ url('accounts:password_reset') }}" class="text-indigo-600 hover:underline">Forgotten your password?</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
